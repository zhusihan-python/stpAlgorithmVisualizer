<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STP 逐步动画</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8;
    --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header {
    width: 100%; max-width: 1000px; padding: 14px 18px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .controls button, .controls select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .controls button:hover:not(:disabled) { border-color: var(--accent); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls button.play { background: var(--accent); border-color: var(--accent); min-width: 56px; }
  #counter { color: var(--muted); font-size: 13px; min-width: 96px; text-align: right; }
  main { width: 100%; max-width: 1000px; padding: 0 18px; }
  .tabs { display: flex; gap: 8px; padding: 0 0 10px; }
  .tabs button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 16px; font-size: 13.5px; cursor: pointer;
  }
  .tabs button.active {
    background: var(--accent); border-color: var(--accent); font-weight: 600;
  }
  .tabs button:hover:not(.active) { border-color: var(--accent); }
  .tabs button.overlay { border-style: dashed; }
  #stage {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: block;
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 4px;
    color: var(--muted); font-size: 12.5px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 18px; height: 0; border-top: 3px solid #475569; display: inline-block; }
  .swatch.tree { border-color: var(--green); border-top-width: 4px; }
  .swatch.blocked { border-color: var(--red); border-top-style: dashed; }
  .swatch.down { border-color: #b91c1c; border-top-style: dotted; border-top-width: 4px; }
  .swatch.edge { border-color: #64748b; border-top-style: dashed; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block; }
  .dot.root { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.35); }
  .dot.proposal { background: #fbbf24; }
  .dot.agreement { background: #2dd4bf; }
  footer {
    width: 100%; max-width: 1000px; padding: 6px 18px 24px;
    display: grid; grid-template-columns: 3fr 2fr; gap: 14px;
  }
  @media (max-width: 760px) { footer { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.65;
  }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #events { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px;
            max-height: 150px; overflow-y: auto; }
  #events li { margin: 2px 0; }
  .controls button.concept { border-color: #6366f1; color: #c7d2fe; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2, 6, 23, .72);
    display: none; z-index: 50; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: min(92vw, 720px); max-height: 84vh; overflow-y: auto;
    padding: 18px 26px 22px;
  }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal h3 { margin: 14px 0 6px; font-size: 13px; color: #818cf8; }
  .modal p { font-size: 13.5px; line-height: 1.75; margin: 4px 0; }
  .modal ul { padding-left: 20px; margin: 4px 0; }
  .modal li { font-size: 13.5px; line-height: 1.7; margin: 3px 0; }
  .modal dt { font-weight: 600; font-size: 13.5px; margin-top: 7px; }
  .modal dd { margin: 1px 0 0 18px; color: var(--muted); font-size: 13px;
              line-height: 1.6; }
  .modal .close {
    float: right; background: none; border: none; color: var(--muted);
    font-size: 19px; cursor: pointer; padding: 0 4px;
  }
  .modal .scenario {
    color: #c7d2fe; font-size: 13px; line-height: 1.6;
    border-left: 3px solid #6366f1; padding-left: 10px; margin: 6px 0 2px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">STP 逐步动画</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="controls">
    <button id="btn-first" title="回到第一步 (Home)">⏮</button>
    <button id="btn-prev" title="上一步 (←)">◀</button>
    <button id="btn-play" class="play" title="播放/暂停 (空格)">▶</button>
    <button id="btn-next" title="下一步 (→)">▶|</button>
    <button id="btn-last" title="最后一步 (End)">⏭</button>
    <select id="speed" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="btn-concept" class="concept" title="核心算法思路讲解">📖 原理</button>
    <span id="counter"></span>
  </div>
</header>
<main>
  <div id="tabs" class="tabs" style="display:none"></div>
  <canvas id="stage"></canvas>
  <div class="legend">
    <span><i class="swatch tree"></i>生成树链路（转发）</span>
    <span><i class="swatch blocked"></i>被阻塞/备用的链路</span>
    <span><i class="swatch"></i>普通链路（收敛前）</span>
    <span><i class="swatch down"></i>断开的链路</span>
    <span><i class="swatch edge"></i>边缘端口（连主机）</span>
    <span><i class="dot"></i>BPDU（根/成本）</span>
    <span><i class="dot proposal"></i>提案 Proposal</span>
    <span><i class="dot agreement"></i>同意 Agreement</span>
    <span><i class="dot root"></i>根桥</span>
  </div>
</main>
<footer>
  <div class="card"><h3>当前步骤</h3><div id="desc"></div></div>
  <div class="card"><h3>本轮 BPDU / 结果</h3><ol id="events"></ol></div>
</footer>

<div id="concept-modal" class="modal-backdrop">
  <div class="modal">
    <button class="close" id="concept-close" title="关闭 (Esc)">✕</button>
    <div id="concept-body"></div>
  </div>
</div>

const topo = DATA.topology;
// Multi-instance protocols (PVST+/MSTP) carry one step list per instance;
// single-instance protocols keep the flat DATA.steps.
const INSTANCES = DATA.instances || null;
const cursors = INSTANCES ? INSTANCES.map(() => 0) : null;
let instIdx = 0;
let steps = INSTANCES ? INSTANCES[0].steps : DATA.steps;
// Overlay comparison view: all instances' converged trees on one canvas.
let overlayMode = false;
const INST_COLORS = ['#22c55e', '#38bdf8', '#f472b6'];
const N = topo.switches.length;

const W = 960, H = 640, R = Math.min(W, H) / 2 - 115;
const CX = W / 2, CY = H / 2 + 6;
const NODE_R = 26;
const PACKET_MS = 1300, HOLD_MS = 900;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
(function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.aspectRatio = W + ' / ' + H;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

const pos = {};
topo.switches.forEach((s, i) => {
  const a = -Math.PI / 2 + 2 * Math.PI * i / N;
  pos[s.id] = { x: CX + R * Math.cos(a), y: CY + R * Math.sin(a) };
});
const swById = {};
topo.switches.forEach(s => { swById[s.id] = s; });
const hosts = topo.hosts || [];
const hpos = {};
hosts.forEach(h => {
  const s = pos[h.attached_to];
  const dx = s.x - CX, dy = s.y - CY;
  const len = Math.hypot(dx, dy) || 1;
  hpos[h.id] = { x: s.x + dx / len * 95, y: s.y + dy / len * 95 };
});

let cur = 0, playing = false, speed = 1, enterTime = performance.now();
let packets = [];

const $ = id => document.getElementById(id);

function packetInfo(e) {
  if (e.kind === 'proposal') return { color: '#fbbf24', ring: '#92400e', label: '提案' };
  if (e.kind === 'agreement') return { color: '#2dd4bf', ring: '#134e4a', label: '同意' };
  return { color: '#f59e0b', ring: '#78350f', label: e.root + '/' + e.cost };
}

function setStep(i, keepPlaying) {
  if (!keepPlaying) { playing = false; }
  cur = Math.max(0, Math.min(steps.length - 1, i));
  enterTime = performance.now();
  const st = steps[cur];
  if (st.kind === 'round' || st.kind === 'handshake' ||
      st.kind === 'switch-online') {
    packets = st.events.map(e => ({
      from: pos[e.from], to: pos[e.to],
      delay: e.delay || 0, ...packetInfo(e),
    }));
  } else {
    packets = [];
  }
  renderPanels();
  updateButtons();
}

function portLine(sid, st) {
  if (st.kind !== 'final') {
    const info = st.switches[sid];
    return '根:' + info.root + ' 成本:' + info.cost +
           (info.root_port ? ' →' + info.root_port : '');
  }
  const p = st.roles.ports[sid];
  const blockedTerm = DATA.protocol === 'rstp' ? '备用' : '阻塞';
  if (sid === st.roles.root) return '根桥 · 全端口指定';
  let line = '根端口→' + p.root_port;
  if (p.blocked.length) line += '；' + blockedTerm + '→' + p.blocked.join(',');
  return line;
}

function renderPanels() {
  if (overlayMode) {
    $('counter').textContent = '叠加对比视图';
    const first = JSON.stringify(INSTANCES[0].link_roles);
    const sameTrees = INSTANCES.every(
      inst => JSON.stringify(inst.link_roles) === first);
    $('desc').textContent =
      '同一物理拓扑上所有实例收敛后的生成树叠加：每种颜色是一个实例的树；' +
      '并行双色线 = 多个实例都在该链路转发；红 ✕ = 对所有实例都是冗余链路。' +
      (sameTrees
        ? '本拓扑各实例的树相同，链路未被分担。'
        : '不同实例的树使用不同链路——冗余链路为部分实例转发，实现负载分担。');
    const list = $('events');
    list.innerHTML = '';
    INSTANCES.forEach(inst => {
      const li = document.createElement('li');
      li.textContent = inst.id +
        (inst.vlans.length > 1 ? '（VLAN ' + inst.vlans.join(',') + '）' : '') +
        ' 根桥：' + inst.root_id;
      list.appendChild(li);
    });
    topo.links.forEach(l => {
      const parts = INSTANCES.map(inst =>
        inst.link_roles[l.id] === 'tree' ? inst.id + ' 转发' : inst.id + ' 阻塞');
      const trees = INSTANCES.filter(
        inst => inst.link_roles[l.id] === 'tree').length;
      const li = document.createElement('li');
      li.textContent = l.id.replace('-', '–') + '：' + parts.join('；');
      if (trees === INSTANCES.length) li.style.color = '#86efac';
      if (trees === 0) li.style.color = '#fca5a5';
      list.appendChild(li);
    });
    return;
  }
  const st = steps[cur];
  $('counter').textContent = '第 ' + (cur + 1) + ' / ' + steps.length + ' 步';
  $('desc').textContent = st.description +
    (cur === 0 && DATA.concept ? '（💡 可先点右上角「📖 原理」了解核心思路。）' : '');
  const list = $('events');
  list.innerHTML = '';
  if (st.kind === 'round' || st.kind === 'handshake') {
    st.events.forEach(e => {
      const li = document.createElement('li');
      if (e.kind === 'proposal') {
        li.textContent = e.from + ' → ' + e.to + '：提案 Proposal';
        li.style.color = '#fcd34d';
      } else if (e.kind === 'agreement') {
        li.textContent = e.from + ' → ' + e.to + '：同意 Agreement';
        li.style.color = '#5eead4';
      } else {
        li.textContent = e.from + ' → ' + e.to + '：根=' + e.root + '，成本=' + e.cost;
      }
      list.appendChild(li);
    });
  } else if (st.kind === 'final') {
    Object.entries(st.roles.blocked_ends).forEach(([linkId, blockedSw]) => {
      const li = document.createElement('li');
      li.textContent = linkId.replace('-', '–') + '：' + blockedSw + ' 侧端口阻塞（备用端口）';
      li.style.color = '#fca5a5';
      list.appendChild(li);
    });
    if (!Object.keys(st.roles.blocked_ends).length) {
      const li = document.createElement('li');
      li.textContent = '无冗余链路，没有端口被阻塞';
      list.appendChild(li);
    }
  } else {
    const li = document.createElement('li');
    li.textContent = '尚未开始 BPDU 交换';
    list.appendChild(li);
  }
}

function updateButtons() {
  const off = overlayMode;
  $('btn-first').disabled = $('btn-prev').disabled = off || cur === 0;
  $('btn-next').disabled = $('btn-last').disabled = off || cur === steps.length - 1;
  $('btn-play').disabled = off;
  $('btn-play').textContent = playing ? '⏸' : '▶';
}

function lerp(p1, p2, t) {
  return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
}

function drawArrow(at, toward, color) {
  const angle = Math.atan2(toward.y - at.y, toward.x - at.x);
  ctx.save();
  ctx.translate(at.x, at.y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(8, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function drawX(at, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(at.x - 7, at.y - 7); ctx.lineTo(at.x + 7, at.y + 7);
  ctx.moveTo(at.x + 7, at.y - 7); ctx.lineTo(at.x - 7, at.y + 7);
  ctx.stroke();
}

function instColor(idx) {
  return INST_COLORS[idx % INST_COLORS.length];
}

function drawOverlay() {
  // Links: one line per forwarding instance (parallel when several), red ✕
  // when redundant for every instance.
  for (const l of topo.links) {
    if (l.appear_at !== undefined && cur < l.appear_at) continue;
    const p1 = pos[l.a], p2 = pos[l.b];
    const fwdIdx = [];
    INSTANCES.forEach((inst, i) => {
      if (inst.link_roles[l.id] === 'tree') fwdIdx.push(i);
    });
    if (fwdIdx.length === 0) {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.setLineDash([9, 7]);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      ctx.setLineDash([]);
      drawX({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, '#ef4444');
    } else {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      const nx = -dy / len, ny = dx / len;
      fwdIdx.slice(0, 2).forEach((idx, k) => {
        const off = fwdIdx.length === 1 ? 0 : (k === 0 ? 3.5 : -3.5);
        ctx.strokeStyle = instColor(idx); ctx.lineWidth = fwdIdx.length === 1 ? 4 : 3;
        ctx.beginPath();
        ctx.moveTo(p1.x + nx * off, p1.y + ny * off);
        ctx.lineTo(p2.x + nx * off, p2.y + ny * off);
        ctx.stroke();
      });
    }
    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 - 7 };
    const costText = '成本 ' + l.cost;
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    const costW = ctx.measureText(costText).width;
    ctx.fillStyle = 'rgba(30,41,59,.92)';
    ctx.fillRect(mid.x - costW / 2 - 3, mid.y - 11, costW + 6, 15);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(costText, mid.x, mid.y);
  }

  // Switches with per-instance root badges.
  for (const s of topo.switches) {
    if (s.appear_at !== undefined && cur < s.appear_at) continue;
    const p = pos[s.id];
    ctx.beginPath(); ctx.arc(p.x, p.y, NODE_R, 0, 2 * Math.PI);
    ctx.fillStyle = '#3b82f6'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.id, p.x, p.y + 5);
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif';
    ctx.fillText(s.bridge_id, p.x, p.y + NODE_R + 16);
    let badge = 0;
    INSTANCES.forEach((inst, i) => {
      if (inst.root_id !== s.id) return;
      const y = p.y - 32 - badge * 16;
      ctx.fillStyle = instColor(i); ctx.font = 'bold 11px sans-serif';
      ctx.fillText('★ ' + inst.id, p.x, y);
      badge++;
    });
  }

  // On-canvas legend, top-left.
  const lx = 16, ly = 14, lw = 200, lh = 30 + (INSTANCES.length + 2) * 20;
  ctx.fillStyle = 'rgba(15,23,42,.85)';
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx, ly, lw, lh, 8); else ctx.rect(lx, ly, lw, lh);
  ctx.fill(); ctx.stroke();
  let yy = ly + 24;
  ctx.textAlign = 'left'; ctx.font = '11.5px sans-serif';
  INSTANCES.forEach((inst, i) => {
    ctx.strokeStyle = instColor(i); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(lx + 12, yy - 4); ctx.lineTo(lx + 40, yy - 4); ctx.stroke();
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(inst.id + '（单色=仅此实例转发）', lx + 48, yy);
    yy += 20;
  });
  ctx.strokeStyle = instColor(0); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(lx + 12, yy - 7); ctx.lineTo(lx + 40, yy - 7); ctx.stroke();
  ctx.strokeStyle = instColor(1); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(lx + 12, yy - 1); ctx.lineTo(lx + 40, yy - 1); ctx.stroke();
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('并行双色=多实例转发', lx + 48, yy);
  yy += 20;
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(lx + 12, yy - 4); ctx.lineTo(lx + 40, yy - 4); ctx.stroke();
  ctx.setLineDash([]);
  drawX({ x: lx + 26, y: yy - 4 }, '#ef4444');
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('全实例冗余（阻塞）', lx + 48, yy);
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  if (overlayMode) {
    drawOverlay();
    requestAnimationFrame(draw);
    return;
  }
  const st = steps[cur];
  const isFinal = st.kind === 'final';
  // RSTP steps carry an explicit per-step link-state map; classic STP only
  // colours links at the final step via roles.
  const stateMap = st.links || (isFinal && st.roles ? st.roles.links : null);
  const blockedEnds = st.blocked_ends || (isFinal && st.roles ? st.roles.blocked_ends : null);

  for (const l of topo.links) {
    if (l.appear_at !== undefined && cur < l.appear_at) continue;
    const p1 = pos[l.a], p2 = pos[l.b];
    const role = stateMap ? stateMap[l.id] : null;
    let color = '#475569', width = 2, dash = [];
    if (role === 'tree' || role === 'forwarding') { color = '#22c55e'; width = 4; }
    if (role === 'blocked' || role === 'alternate') { color = '#ef4444'; width = 2.5; dash = [9, 7]; }
    if (role === 'down') { color = '#b91c1c'; width = 4; dash = [3, 6]; }
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.setLineDash([]);
    const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 - 7 };
    const costText = '成本 ' + l.cost;
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    const costW = ctx.measureText(costText).width;
    ctx.fillStyle = 'rgba(30,41,59,.92)';  // backdrop so the label reads over the line
    ctx.fillRect(mid.x - costW / 2 - 3, mid.y - 11, costW + 6, 15);
    ctx.fillStyle = role === 'down' ? '#7f1d1d' : '#94a3b8';
    ctx.fillText(costText, mid.x, mid.y);
    if (role === 'down') {
      drawX({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }, '#ef4444');
    } else if ((role === 'blocked' || role === 'alternate') && blockedEnds && blockedEnds[l.id]) {
      const blockedSw = blockedEnds[l.id];
      const other = pos[blockedSw === l.a ? l.b : l.a];
      drawX(lerp(pos[blockedSw], other, 0.3), '#ef4444');
    }
  }

  // Edge links and host nodes (RSTP).
  for (const h of hosts) {
    const s = pos[h.attached_to], p = hpos[h.id];
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('边缘', (s.x + p.x) / 2, (s.y + p.y) / 2 - 6);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x - 24, p.y - 16, 48, 32, 6);
    else ctx.rect(p.x - 24, p.y - 16, 48, 32);
    ctx.fillStyle = '#475569'; ctx.fill();
    ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(h.id, p.x, p.y + 4);
  }

  if (st.kind === 'round') {
    for (const sid in st.switches) {
      const rp = st.switches[sid].root_port;
      if (rp) drawArrow(lerp(pos[sid], pos[rp], 0.58), pos[rp], '#22c55e');
    }
  }

  for (const s of topo.switches) {
    if (s.appear_at !== undefined && cur < s.appear_at) continue;
    if (!st.switches[s.id]) continue;   // not part of the story yet
    const p = pos[s.id];
    const info = st.switches[s.id];
    const isRoot = isFinal && st.roles.root === s.id;
    ctx.beginPath(); ctx.arc(p.x, p.y, NODE_R, 0, 2 * Math.PI);
    ctx.fillStyle = isRoot ? '#f59e0b' : '#3b82f6'; ctx.fill();
    if (!isFinal && info.root === s.id) {
      ctx.lineWidth = 4; ctx.strokeStyle = '#facc15'; ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.id, p.x, p.y + 5);
    if (isRoot) { ctx.fillStyle = '#fde68a'; ctx.font = 'bold 16px sans-serif';
                  ctx.fillText('★', p.x, p.y - 34); }
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif';
    ctx.fillText(s.bridge_id, p.x, p.y + NODE_R + 16);
    ctx.fillStyle = isFinal ? '#86efac' : '#cbd5e1'; ctx.font = '11.5px sans-serif';
    ctx.fillText(portLine(s.id, st), p.x, p.y + NODE_R + 32);
  }

  if (st.kind === 'round' || st.kind === 'handshake' ||
      st.kind === 'switch-online') {
    let maxDelay = 0;
    for (const pk of packets) maxDelay = Math.max(maxDelay, pk.delay);
    ctx.font = '10px sans-serif';
    for (const pk of packets) {
      const t = Math.min(1, Math.max(0,
        (now - enterTime) / (PACKET_MS / speed) - pk.delay));
      if (t <= 0 && pk.delay > 0) continue;  // reply packet not sent yet
      const q = lerp(pk.from, pk.to, t);
      ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, 2 * Math.PI);
      ctx.fillStyle = pk.color; ctx.fill();
      ctx.strokeStyle = pk.ring; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fde68a'; ctx.textAlign = 'center';
      ctx.fillText(pk.label, q.x, q.y - 11);
    }
    if (playing && now > enterTime + ((1 + maxDelay) * PACKET_MS + HOLD_MS) / speed) {
      advance();
    }
  } else if (playing && now > enterTime + 500 / speed) {
    advance();
  }
  requestAnimationFrame(draw);
}

function advance() {
  if (cur < steps.length - 1) setStep(cur + 1, true);
  else { playing = false; updateButtons(); }
}

$('btn-first').onclick = () => setStep(0);
$('btn-prev').onclick = () => setStep(cur - 1);
$('btn-next').onclick = () => setStep(cur + 1);
$('btn-last').onclick = () => setStep(steps.length - 1);
$('btn-play').onclick = () => {
  if (!playing && cur === steps.length - 1) setStep(0);  // replay from the start
  playing = !playing; enterTime = performance.now(); updateButtons();
};
$('speed').onchange = e => { speed = parseFloat(e.target.value); };

document.addEventListener('keydown', e => {
  if (overlayMode) return;
  if (e.key === 'ArrowLeft') { setStep(cur - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { setStep(cur + 1); e.preventDefault(); }
  else if (e.key === ' ') { $('btn-play').click(); e.preventDefault(); }
  else if (e.key === 'Home') { setStep(0); e.preventDefault(); }
  else if (e.key === 'End') { setStep(steps.length - 1); e.preventDefault(); }
});

function buildTabs() {
  if (!INSTANCES) return;
  const holder = $('tabs');
  holder.style.display = 'flex';
  INSTANCES.forEach((inst, i) => {
    const btn = document.createElement('button');
    btn.textContent = inst.id +
      (inst.vlans.length > 1 ? '（VLAN ' + inst.vlans.join(',') + '）' : '');
    btn.onclick = () => switchInstance(i);
    holder.appendChild(btn);
  });
  const overlayBtn = document.createElement('button');
  overlayBtn.className = 'overlay';
  overlayBtn.textContent = '叠加对比';
  overlayBtn.onclick = () => switchInstance(INSTANCES.length);
  holder.appendChild(overlayBtn);
  updateTabs();
}

function updateTabs() {
  if (!INSTANCES) return;
  [...$('tabs').children].forEach((btn, i) =>
    btn.classList.toggle('active', overlayMode ? i === INSTANCES.length
                                               : i === instIdx));
}

function switchInstance(i) {
  if (!INSTANCES) return;
  if (i === INSTANCES.length) {         // overlay comparison tab
    cursors[instIdx] = cur;
    overlayMode = true;
    playing = false;
    enterTime = performance.now();
    renderPanels();
    updateButtons();
    updateTabs();
    return;
  }
  if (i === instIdx && !overlayMode) return;
  cursors[instIdx] = cur;
  overlayMode = false;
  instIdx = i;
  steps = INSTANCES[i].steps;
  playing = false;
  setStep(cursors[i]);
  updateTabs();
}

function buildConceptModal() {
  const modal = $('concept-modal');
  if (!DATA.concept) { $('btn-concept').style.display = 'none'; return; }
  const c = DATA.concept;
  let html = '<h2>' + c.title + '</h2>';
  if (c.scenario) html += '<p class="scenario">' + c.scenario + '</p>';
  html += '<h3>要解决的问题</h3><p>' + c.problem + '</p>';
  html += '<h3>核心思路</h3><p>' + c.idea + '</p>';
  if (c.rules) {
    html += '<h3>关键规则</h3><ul>' +
            c.rules.map(r => '<li>' + r + '</li>').join('') + '</ul>';
  }
  if (c.glossary) {
    html += '<h3>术语速查</h3><dl>' +
            c.glossary.map(g => '<dt>' + g[0] + '</dt><dd>' + g[1] + '</dd>')
                      .join('') + '</dl>';
  }
  $('concept-body').innerHTML = html;
  $('btn-concept').onclick = () => modal.classList.add('open');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('open'); };
  $('concept-close').onclick = () => modal.classList.remove('open');
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') modal.classList.remove('open');
  });
}

$('title').textContent = DATA.title;
$('subtitle').textContent = DATA.subtitle;
buildConceptModal();
buildTabs();
setStep(0);
requestAnimationFrame(draw);
</script>
</body>
</html>
