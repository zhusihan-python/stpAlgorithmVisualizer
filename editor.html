<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STP 拓扑编辑器</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8;
    --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 14px 18px 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 18px 10px; }
  section { width: 100%; max-width: 1000px; padding: 0 18px 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
         padding: 8px 0; }
  .bar button, .bar select, .bar input {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13.5px;
  }
  .bar button.active { background: var(--accent); border-color: var(--accent); }
  .bar button.primary { background: var(--green); border-color: var(--green);
                        font-weight: 600; padding: 6px 18px; }
  .bar input { width: 70px; }
  .bar label { color: var(--muted); font-size: 12.5px; }
  #ed-stage { width: 100%; background: var(--panel); border: 1px solid var(--border);
              border-radius: 12px; display: block; cursor: crosshair; }
  .layout { display: grid; grid-template-columns: 1fr 240px; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }
  .panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .panel input[type=number] { width: 100%; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 5px 8px; margin: 4px 0 10px; }
  .panel button { width: 100%; margin-top: 6px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 6px; cursor: pointer; }
  .panel button.danger { color: #fca5a5; border-color: #7f1d1d; }
  #ed-status { color: var(--muted); font-size: 12.5px; min-height: 18px;
               padding-top: 6px; }
  #ed-status.error { color: #fca5a5; }
  #ed-status.ok { color: #86efac; }
  textarea { width: 100%; height: 130px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
    font-family: ui-monospace, monospace; }

  /* ---- player shell (same markup/ids as template.html) ---- */
  header.player { width: 100%; max-width: 1000px; padding: 14px 18px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  header.player h1 { margin: 0; font-size: 18px; }
  header.player .sub { margin: 0; }
  .controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .controls button, .controls select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .controls button:hover:not(:disabled) { border-color: var(--accent); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls button.play { background: var(--accent); border-color: var(--accent); min-width: 56px; }
  .controls button.concept { border-color: #6366f1; color: #c7d2fe; }
  #counter { color: var(--muted); font-size: 13px; min-width: 96px; text-align: right; }
  .tabs { display: flex; gap: 8px; padding: 0 0 10px; }
  .tabs button { background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px;
    font-size: 13.5px; cursor: pointer; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tabs button:hover:not(.active) { border-color: var(--accent); }
  .tabs button.overlay { border-style: dashed; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 4px;
            color: var(--muted); font-size: 12.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 18px; height: 0; border-top: 3px solid #475569; display: inline-block; }
  .swatch.tree { border-color: var(--green); border-top-width: 4px; }
  .swatch.blocked { border-color: var(--red); border-top-style: dashed; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block; }
  .dot.root { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.35); }
  .dot.proposal { background: #fbbf24; }
  .dot.agreement { background: #2dd4bf; }
  footer.player { width: 100%; max-width: 1000px; padding: 6px 18px 24px;
    display: grid; grid-template-columns: 3fr 2fr; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.65; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #events { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px;
            max-height: 150px; overflow-y: auto; }
  #events li { margin: 2px 0; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(2,6,23,.72);
    display: none; z-index: 50; align-items: center; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; width: min(92vw, 720px); max-height: 84vh;
    overflow-y: auto; padding: 18px 26px 22px; }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal h3 { margin: 14px 0 6px; font-size: 13px; color: #818cf8; }
  .modal p { font-size: 13.5px; line-height: 1.75; margin: 4px 0; }
  .modal ul { padding-left: 20px; margin: 4px 0; }
  .modal li { font-size: 13.5px; line-height: 1.7; margin: 3px 0; }
  .modal dt { font-weight: 600; font-size: 13.5px; margin-top: 7px; }
  .modal dd { margin: 1px 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .modal .close { float: right; background: none; border: none; color: var(--muted);
    font-size: 19px; cursor: pointer; padding: 0 4px; }
  .modal .scenario { color: #c7d2fe; font-size: 13px; line-height: 1.6;
    border-left: 3px solid #6366f1; padding-left: 10px; margin: 6px 0 2px; }
  #stage { width: 100%; background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; display: block; }
</style>
</head>
<body>
<h1>STP 拓扑编辑器</h1>
<p class="sub">拖动节点摆放、点击两台交换机连边、在右侧调整优先级/成本，然后「生成动画」在下方播放。</p>

<section>
  <div class="bar">
    <button id="ed-tool-select" class="active" title="选择/拖动">选择</button>
    <button id="ed-tool-add" title="点击画布空白处添加交换机">添加交换机</button>
    <button id="ed-tool-link" title="依次点击两台交换机连边">连线</button>
    <button id="ed-tool-delete" title="点击交换机或链路删除">删除</button>
    <span style="width:12px"></span>
    <button id="ed-sample">载入样例</button>
    <button id="ed-clear">清空</button>
    <button id="ed-io">导入/导出 JSON</button>
    <span style="width:12px"></span>
    <label>协议
      <select id="ed-protocol">
        <option value="stp">STP</option>
        <option value="rstp" selected>RSTP</option>
        <option value="pvst">PVST+</option>
        <option value="mstp">MSTP</option>
      </select>
    </label>
    <label>种子 <input id="ed-seed" type="number" value="42"></label>
    <button id="ed-generate" class="primary">▶ 生成动画</button>
  </div>
  <div class="layout">
    <canvas id="ed-stage"></canvas>
    <div>
      <div class="panel" id="ed-panel"><h3>属性</h3><div id="ed-props">点击画布中的交换机或链路。</div></div>
      <div class="panel" style="margin-top:12px" id="ed-io-box" hidden>
        <h3>拓扑 JSON</h3>
        <textarea id="ed-io-text" spellcheck="false"></textarea>
        <button id="ed-io-apply">应用此 JSON</button>
      </div>
      <div id="ed-status"></div>
    </div>
  </div>
</section>

<header class="player">
  <div>
    <h1 id="title">预览播放器</h1>
    <div class="sub" id="subtitle">生成动画后在这里逐步播放</div>
  </div>
  <div class="controls">
    <button id="btn-first" title="回到第一步 (Home)">⏮</button>
    <button id="btn-prev" title="上一步 (←)">◀</button>
    <button id="btn-play" class="play" title="播放/暂停 (空格)">▶</button>
    <button id="btn-next" title="下一步 (→)">▶|</button>
    <button id="btn-last" title="最后一步 (End)">⏭</button>
    <select id="speed" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="btn-concept" class="concept" title="核心算法思路讲解">📖 原理</button>
    <span id="counter"></span>
  </div>
</header>
<section>
  <div id="tabs" class="tabs" style="display:none"></div>
  <canvas id="stage"></canvas>
  <div class="legend">
    <span><i class="swatch tree"></i>生成树链路（转发）</span>
    <span><i class="swatch blocked"></i>被阻塞/备用的链路</span>
    <span><i class="swatch"></i>普通链路（收敛前）</span>
    <span><i class="dot"></i>BPDU（根/成本）</span>
    <span><i class="dot proposal"></i>提案 Proposal</span>
    <span><i class="dot agreement"></i>同意 Agreement</span>
    <span><i class="dot root"></i>根桥</span>
  </div>
</section>
<footer class="player">
  <div class="card"><h3>当前步骤</h3><div id="desc"></div></div>
  <div class="card"><h3>本轮 BPDU / 结果</h3><ol id="events"></ol></div>
</footer>

<div id="concept-modal" class="modal-backdrop">
  <div class="modal">
    <button class="close" id="concept-close" title="关闭 (Esc)">✕</button>
    <div id="concept-body"></div>
  </div>
</div>

<script src="player.js"></script>
<script src="editor.js"></script>
</body>
</html>
